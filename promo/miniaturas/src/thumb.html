<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../public/fonts/inter-var.woff2);font-weight:100 900}
@font-face{font-family:JBM;src:url(../../public/fonts/jbm-800.woff2);font-weight:800}
@font-face{font-family:JBM;src:url(../../public/fonts/jbm-500.woff2);font-weight:500}
*{margin:0;box-sizing:border-box}
body{width:var(--w);height:var(--h);background:#0b0b0b;overflow:hidden;position:relative;font-family:Inter;color:#fff}
.photo{position:absolute;background-size:cover;filter:saturate(.85) contrast(1.05)}
.shade{position:absolute;inset:0}
.grain{position:absolute;inset:0;background:url(../../public/fx/grain1.png);opacity:.18;mix-blend-mode:overlay}
.term{font-family:JBM;font-weight:500;color:#22c55e}
.cursor{display:inline-block;background:#22c55e;width:.55em;height:1em;vertical-align:-.12em;margin-left:.1em}
h1{font-weight:900;letter-spacing:-.045em;line-height:.92}
.hl{background:#22c55e;color:#04140a;padding:0 .14em;display:inline-block}
.logo{display:flex;align-items:center;gap:.4em}
.tag{font-family:JBM;font-weight:500;border:2px solid rgba(34,197,94,.6);padding:.25em .6em;color:#d1fae5;background:rgba(0,0,0,.55)}
</style></head><body>
<!-- YT -->
<div id="yt" style="display:none">
 <div class="photo" style="inset:0 0 0 38%;background-image:url(../../public/photos/regional-2025-equipo.jpg);background-position:35% 35%"></div>
 <div class="shade" style="background:linear-gradient(90deg,#0b0b0b 36%,rgba(11,11,11,.85) 46%,rgba(11,11,11,0) 70%),linear-gradient(0deg,rgba(11,11,11,.7),transparent 35%)"></div>
 <div class="grain"></div>
 <div style="position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:18px">
  <img src="../../public/brand/mark_full.png" style="height:84px"><img src="../../public/brand/word_white.png" style="height:40px">
 </div>
 <div class="term" style="position:absolute;left:66px;top:200px;font-size:30px">&gt; ./goslint --join<span class="cursor"></span></div>
 <h1 style="position:absolute;left:60px;top:250px;font-size:118px">¿Te gusta<br>resolver<br><span class="hl">problemas?</span></h1>
 <div style="position:absolute;left:64px;bottom:52px;display:flex;gap:14px;font-size:24px"><span class="tag">ICPC</span><span class="tag">C++ · Python · Java</span><span class="tag">UCEVA</span></div>
</div>
<!-- REEL -->
<div id="reel" style="display:none">
 <div class="photo" style="inset:0;background-image:url(../../public/photos/nacional-javeriana-cali.jpg);background-position:50% 70%"></div>
 <div class="shade" style="background:linear-gradient(180deg,#0b0b0b 0%,rgba(11,11,11,.92) 30%,rgba(11,11,11,.15) 52%,rgba(11,11,11,.2) 72%,#0b0b0b 92%)"></div>
 <div class="grain"></div>
 <div style="position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;align-items:center;gap:26px">
  <img src="../../public/brand/mark_full.png" style="height:120px"><img src="../../public/brand/word_white.png" style="height:58px">
 </div>
 <div class="term" style="position:absolute;left:80px;top:360px;font-size:40px">&gt; ./goslint --join<span class="cursor"></span></div>
 <h1 style="position:absolute;left:72px;top:425px;font-size:150px">¿Te gusta<br>resolver<br><span class="hl">problemas?</span></h1>
 <div style="position:absolute;left:0;right:0;bottom:250px;text-align:center">
  <div style="font-weight:900;font-size:92px;letter-spacing:-.04em">Únete a <span style="color:#22c55e">Goslint.</span></div>
  <div class="term" style="margin-top:22px;font-size:30px;color:#d1fae5">Semillero de Investigación · UCEVA</div>
 </div>
</div>
<script>const m=location.hash.slice(1);document.getElementById(m).style.display='block';</script>
</body></html>
